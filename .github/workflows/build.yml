name: Build iOS IPA

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Archive (unsigned)
        run: |
          xcodebuild archive \
            -project RealtimeTranslator.xcodeproj \
            -scheme RealtimeTranslator \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/RealtimeTranslator.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          mkdir -p build/Payload
          cp -R "build/RealtimeTranslator.xcarchive/Products/Applications/RealtimeTranslator.app" build/Payload/
          cd build
          zip -r RealtimeTranslator.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: RealtimeTranslator-ipa
          path: build/RealtimeTranslator.ipa
